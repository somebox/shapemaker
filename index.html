<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shapemaker</title>
  <!-- Paths are ./relative so GitHub Pages project sites (/repo/) work. -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>
  <style>
    @font-face {
      font-family: "Archivo";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("./vendor/fonts/archivo/archivo-latin-400-normal.woff2") format("woff2");
    }
    @font-face {
      font-family: "Archivo";
      font-style: normal;
      font-weight: 600;
      font-display: swap;
      src: url("./vendor/fonts/archivo/archivo-latin-600-normal.woff2") format("woff2");
    }
    @font-face {
      font-family: "IBM Plex Mono";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("./vendor/fonts/plex-mono/ibm-plex-mono-latin-400-normal.woff2") format("woff2");
    }
    @font-face {
      font-family: "IBM Plex Mono";
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: url("./vendor/fonts/plex-mono/ibm-plex-mono-latin-500-normal.woff2") format("woff2");
    }

    :root {
      color-scheme: dark;
      --bg: #121214;
      --panel: #1a1a1e;
      --panel-inset: #212127;
      --line: #2e2e36;
      --line-tick: #46464f;
      --text: #e8e6e3;
      --text-dim: #97938c;
      --accent: #c4a882;
      --accent-ink: #16130e;
      --ok: #8fb98a;
      --warn: #d9a05b;
      --err: #d97b6c;
      --focus: #d8c9ae;
      --font-ui: "Archivo", system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
      font-family: var(--font-ui);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
    #app {
      display: grid;
      grid-template-columns: 1fr 312px;
      grid-template-rows: 1fr auto;
      height: 100%;
      min-height: 0;
    }
    #canvas-host { grid-column: 1; grid-row: 1; position: relative; min-width: 0; min-height: 0; }
    #canvas-host canvas { display: block; width: 100%; height: 100%; }
    #panel { grid-column: 2; grid-row: 1 / 3; }

    /* Persistent status bar under the view: stats, busy badge, export. */
    #bottombar {
      grid-column: 1;
      grid-row: 2;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 8px 14px;
      background: var(--panel);
      border-top: 1px solid var(--line);
      min-width: 0;
    }

    /* Busy badge — painted before a heavy compile so the UI never looks
       locked. The blocking work freezes the animation; presence is the
       signal. */
    #busy {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 9px;
      border: 1px solid var(--line);
      border-radius: 3px;
      font: 500 10px var(--font-mono);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-dim);
      flex-shrink: 0;
      pointer-events: none;
    }
    /* Explicit display beats the hidden attribute; restore it. */
    #busy[hidden] { display: none; }
    .busy-ring {
      width: 10px;
      height: 10px;
      border: 2px solid var(--line-tick);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: busy-spin 0.8s linear infinite;
    }
    @keyframes busy-spin {
      to { transform: rotate(360deg); }
    }

    #panel {
      background: var(--panel);
      border-left: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
    }
    #panel-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px 10px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .identity {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 28px;
    }
    .identity-name {
      flex: 1;
      min-width: 0;
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      font: 600 0.95rem var(--font-ui);
      padding: 2px 4px;
      margin: -2px -4px;
      border-radius: 2px;
    }
    .identity-name:hover,
    .identity-name:focus {
      background: var(--panel-inset);
      border-color: var(--line);
      outline: none;
    }
    .identity-name:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    .dirty-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
      opacity: 0;
    }
    .dirty-dot[data-on="1"] { opacity: 1; }
    .dirty-label {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--text-dim);
      opacity: 0;
    }
    .dirty-label[data-on="1"] { opacity: 1; }

    .group-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .group-header span {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .group-header::before,
    .group-header::after {
      content: "";
      height: 1px;
      background: var(--line);
      position: relative;
    }
    .group-header::before {
      width: 3px;
      height: 3px;
      background: var(--line-tick);
      flex-shrink: 0;
    }
    .group-header::after {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, var(--line), var(--line));
      box-shadow: 3px 0 0 0 var(--line-tick);
    }

    .group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      animation: rise-in 300ms ease both;
    }
    .group:nth-child(2) { animation-delay: 40ms; }
    .group:nth-child(3) { animation-delay: 80ms; }
    .group:nth-child(4) { animation-delay: 120ms; }
    .group:nth-child(5) { animation-delay: 160ms; }
    @keyframes rise-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .group { animation: none; opacity: 1; transform: none; }
    }

    .control { display: flex; flex-direction: column; gap: 2px; }
    .control[data-hidden="1"] { display: none; }
    .control[data-inert="1"] {
      opacity: 0.38;
      pointer-events: none;
    }

    .start-group { margin: 0 0 4px; }
    .start-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .start-header > span:first-child { flex: 1 1 auto; }
    /* Session mode + Undo live at the header's right edge; no trailing rule. */
    .start-header::after { display: none; }
    .session-mode {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .session-mode[data-mode="edit"] {
      color: var(--accent);
    }
    .undo-chip { flex-shrink: 0; }
    .start-strip {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }
    .start-subhead {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-top: 2px;
    }
    .start-cards {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .start-card {
      appearance: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      width: 60px;
      padding: 6px 2px 5px;
      background: var(--panel-inset);
      border: 1px solid var(--line);
      border-radius: 3px;
      color: var(--text-dim);
      font: 500 9px var(--font-ui);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .start-card:hover {
      color: var(--text);
      border-color: var(--line-tick);
    }
    .start-card:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    .start-card[data-active="1"] {
      border-color: var(--accent);
      color: var(--accent);
    }
    .start-card[data-edited="1"] {
      border-style: dashed;
      border-color: var(--accent);
      color: var(--text);
    }
    .start-thumb {
      display: block;
      width: 38px;
      height: 38px;
    }
    .start-thumb svg {
      display: block;
      width: 100%;
      height: 100%;
    }
    .thumb-back { opacity: 0.25; }
    .start-card-label {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .start-presets .start-card { width: 84px; }
    .start-presets .start-card-label {
      white-space: normal;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      line-height: 1.3;
    }
    .control.has-error .num-well {
      border-color: var(--err);
      background: color-mix(in srgb, var(--err) 12%, var(--panel-inset));
    }
    .control-error {
      font-size: 12px;
      color: var(--err);
      margin: 0;
      line-height: 1.3;
    }
    .control-error:empty { display: none; }

    .control-row {
      display: grid;
      grid-template-columns: 1fr 7ch 2.5ch;
      align-items: center;
      gap: 6px;
      min-height: 24px;
    }
    .control-row label {
      font-size: 0.8rem;
      color: var(--text-dim);
    }
    .num-well {
      display: contents;
    }
    .control-row input[type="number"] {
      appearance: textfield;
      -moz-appearance: textfield;
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      font: 400 0.8rem var(--font-mono);
      font-variant-numeric: tabular-nums;
      text-align: right;
      padding: 3px 4px;
      border-radius: 2px;
    }
    .control-row input[type="number"]::-webkit-outer-spin-button,
    .control-row input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .control-row input[type="number"]:hover,
    .control-row input[type="number"]:focus {
      background: var(--panel-inset);
      border-color: var(--line);
      outline: none;
    }
    .control-row input[type="number"]:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    .unit {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-dim);
      opacity: 0.6;
    }

    .slider-wrap { padding: 0 2px; }
    .slider-limits {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--text-dim);
      margin-top: 2px;
    }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 20px;
      background: transparent;
      margin: 0;
      cursor: pointer;
    }
    input[type="range"]:focus { outline: none; }
    input[type="range"]:focus-visible::-webkit-slider-thumb {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 2px;
      background: var(--line-tick);
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 20px;
      margin-top: -9px;
      background: var(--text-dim);
      border: none;
      border-radius: 1px;
      transition: background 120ms ease;
    }
    input[type="range"]:active::-webkit-slider-thumb,
    input[type="range"]:focus::-webkit-slider-thumb {
      background: var(--accent);
    }
    input[type="range"]::-moz-range-track {
      height: 2px;
      background: var(--line-tick);
    }
    input[type="range"]::-moz-range-thumb {
      width: 12px;
      height: 20px;
      background: var(--text-dim);
      border: none;
      border-radius: 1px;
    }
    input[type="range"]:active::-moz-range-thumb,
    input[type="range"]:focus::-moz-range-thumb {
      background: var(--accent);
    }

    .segments {
      display: flex;
      border: 1px solid var(--line);
      border-radius: 2px;
      overflow: hidden;
    }
    .segments button {
      flex: 1;
      appearance: none;
      border: none;
      border-radius: 0;
      background: transparent;
      color: var(--text-dim);
      font: 400 0.75rem var(--font-ui);
      padding: 0.45rem 0.4rem;
      cursor: pointer;
      letter-spacing: 0.02em;
      box-shadow: inset 0 -2px 0 transparent;
    }
    .segments button[aria-pressed="true"] {
      background: var(--panel-inset);
      color: var(--text);
      box-shadow: inset 0 -2px 0 var(--accent);
    }
    .segments button:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: -2px;
      z-index: 1;
    }
    .seg-custom {
      align-self: center;
      padding: 0 0.5rem;
      font: 500 0.65rem var(--font-mono);
      color: var(--warn);
      white-space: nowrap;
    }
    .reroll {
      appearance: none;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: transparent;
      color: var(--text-dim);
      font: 500 0.8rem var(--font-mono);
      width: 1.6rem;
      height: 1.6rem;
      cursor: pointer;
      line-height: 1;
    }
    .reroll:hover { color: var(--accent); border-color: var(--accent); }
    .reroll:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
    input.is-readout {
      opacity: 0.65;
      pointer-events: none;
    }

    .hint {
      margin: 0;
      font-size: 0.7rem;
      color: var(--text-dim);
      line-height: 1.35;
    }

    .inspect-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 8px;
      font-size: 0.75rem;
    }
    .inspect-grid dt { color: var(--text-dim); margin: 0; }
    .inspect-grid dd {
      margin: 0;
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    .inspect-grid dd .u { color: var(--text-dim); opacity: 0.6; margin-left: 0.25em; }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn {
      appearance: none;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text);
      padding: 0.55rem 0.9rem;
      border-radius: 2px;
      font: 600 11px var(--font-ui);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 120ms ease, color 120ms ease;
    }
    .btn:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn-accent {
      border-color: var(--accent);
      color: var(--accent);
    }
    .btn-accent:hover:not(:disabled) {
      background: var(--accent);
      color: var(--accent-ink);
    }
    .btn:hover:not(:disabled):not(.btn-accent) {
      background: var(--panel-inset);
    }
    .face-readout {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-dim);
    }
    .face-stepper {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }
    .btn-quiet {
      appearance: none;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text-dim);
      padding: 0.25rem 0.45rem;
      border-radius: 2px;
      font: 500 11px var(--font-mono);
      cursor: pointer;
    }
    .btn-quiet:hover {
      color: var(--text);
      border-color: var(--text-dim);
    }
    .base-warn {
      color: var(--warn, #c4a882);
      margin: 0 0 6px;
    }
    .preset-chip {
      appearance: none;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text-dim);
      padding: 0.3rem 0.55rem;
      border-radius: 2px;
      font: 500 10px var(--font-ui);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .preset-chip[data-active="1"] {
      border-color: var(--accent);
      color: var(--accent);
    }
    .preset-chip[data-edited="1"] {
      border-style: dashed;
      color: var(--text);
    }
    .preset-chip:hover {
      color: var(--text);
    }
    .preset-chip:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .version {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--text-dim);
      opacity: 0.4;
      text-align: right;
      margin-top: 4px;
    }

    #dimension-strip {
      flex: 1 1 auto;
      min-width: 0;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-variant-numeric: tabular-nums;
      color: var(--text-dim);
      line-height: 1.45;
      white-space: pre-wrap;
      overflow: hidden;
    }
    #dimension-strip .cell {
      display: inline;
      border-radius: 2px;
      transition: background 150ms ease;
    }
    #dimension-strip .cell[data-changed="1"] {
      background: color-mix(in srgb, var(--accent) 28%, transparent);
    }
    #dimension-strip .err { color: var(--err); }

    @media (max-width: 899px) {
      #app { grid-template-columns: 1fr; }
      #bottombar { grid-column: 1; }
      #panel {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(312px, 100%);
        z-index: 2;
        box-shadow: -8px 0 24px rgba(0, 0, 0, 0.35);
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="canvas-host"></div>
    <aside id="panel"></aside>
    <footer id="bottombar">
      <div id="dimension-strip" aria-live="polite">compiling…</div>
      <div id="busy" hidden>
        <span class="busy-ring" aria-hidden="true"></span>
        <span>updating</span>
      </div>
    </footer>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
