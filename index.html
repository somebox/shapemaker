<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shapemaker</title>
  <!-- Paths are ./relative so GitHub Pages project sites (/repo/) work. -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #121214;
      --panel: #1c1c22;
      --text: #e8e6e3;
      --muted: #9a9690;
      --accent: #c4a882;
      --border: #2e2e36;
      font-family: "IBM Plex Sans", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
    #app {
      display: grid;
      grid-template-rows: 1fr auto;
      height: 100%;
    }
    #main {
      display: grid;
      grid-template-columns: 1fr 260px;
      min-height: 0;
    }
    #canvas-host { position: relative; min-width: 0; min-height: 0; }
    #canvas-host canvas { display: block; width: 100%; height: 100%; }
    #panel {
      background: var(--panel);
      border-left: 1px solid var(--border);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    #panel h1 {
      font-size: 1rem;
      font-weight: 600;
      margin: 0;
      letter-spacing: 0.02em;
    }
    #panel p {
      margin: 0;
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.4;
    }
    button {
      appearance: none;
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
      padding: 0.55rem 0.9rem;
      border-radius: 4px;
      font: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }
    button:hover { background: color-mix(in srgb, var(--accent) 18%, transparent); }
    #status {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.75rem;
      white-space: pre-wrap;
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding: 0.55rem 1rem;
      color: var(--muted);
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="main">
      <div id="canvas-host"></div>
      <aside id="panel">
        <h1>Shapemaker</h1>
        <p>
          Prototype TPU defaults — icosidodecahedron frame, Ø100&nbsp;mm.
          Click a face to rest on it. Camera orbits; the model stays put.
        </p>
        <button type="button" id="btn-export">Export STL</button>
      </aside>
    </div>
    <div id="status">compiling…</div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
