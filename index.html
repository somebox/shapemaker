<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Shapemaker</title>
  <!-- Paths are ./relative so GitHub Pages project sites (/repo/) work. -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>
  <style>
    @font-face {
      font-family: "Archivo";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("./vendor/fonts/archivo/archivo-latin-400-normal.woff2") format("woff2");
    }
    @font-face {
      font-family: "Archivo";
      font-style: normal;
      font-weight: 600;
      font-display: swap;
      src: url("./vendor/fonts/archivo/archivo-latin-600-normal.woff2") format("woff2");
    }
    @font-face {
      font-family: "IBM Plex Mono";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("./vendor/fonts/plex-mono/ibm-plex-mono-latin-400-normal.woff2") format("woff2");
    }
    @font-face {
      font-family: "IBM Plex Mono";
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: url("./vendor/fonts/plex-mono/ibm-plex-mono-latin-500-normal.woff2") format("woff2");
    }

    :root {
      color-scheme: dark;
      --bg: #121214;
      --panel: #1a1a1e;
      --panel-inset: #212127;
      --line: #2e2e36;
      --line-tick: #46464f;
      --text: #e8e6e3;
      --text-dim: #97938c;
      --accent: #c4a882;
      --accent-ink: #16130e;
      --ok: #8fb98a;
      --warn: #d9a05b;
      --err: #d97b6c;
      --focus: #d8c9ae;
      --font-ui: "Archivo", system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
      font-family: var(--font-ui);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
    #app {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      grid-template-rows: auto minmax(0, 1fr) auto;
      height: 100%;
      height: 100dvh;
      min-height: 0;
      overflow: hidden;
    }
    #app-header {
      grid-column: 1 / -1;
      grid-row: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: calc(6px + env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) 6px max(14px, env(safe-area-inset-left));
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      min-width: 0;
      z-index: 3;
    }
    .app-brand {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
      flex-shrink: 0;
    }
    .app-title {
      font: 600 0.95rem var(--font-ui);
      letter-spacing: 0.02em;
      color: var(--text);
    }
    .app-version {
      font: 400 0.65rem var(--font-mono);
      color: var(--text-dim);
      opacity: 0.7;
    }
    .app-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .app-header-link {
      font: 500 0.7rem var(--font-ui);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-dim);
      text-decoration: none;
      padding: 4px 6px;
      border-radius: 2px;
    }
    .app-header-link:hover { color: var(--text); }
    .app-header-link:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    .app-header-help {
      appearance: none;
      width: 1.6rem;
      height: 1.6rem;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: transparent;
      color: var(--text-dim);
      font: 600 0.75rem var(--font-mono);
      cursor: pointer;
      line-height: 1;
    }
    .app-header-help:hover {
      color: var(--accent);
      border-color: var(--accent);
    }
    .app-header-help:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    #canvas-host { grid-column: 1; grid-row: 2 / 4; position: relative; min-width: 0; min-height: 0; }
    #canvas-host canvas { display: block; width: 100%; height: 100%; }
    .dim-callout {
      position: absolute;
      left: 12px;
      bottom: 12px;
      z-index: 1;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: color-mix(in srgb, var(--panel) 88%, transparent);
      font: 500 0.75rem var(--font-mono);
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      pointer-events: none;
      backdrop-filter: blur(4px);
    }
    .dim-callout[hidden] { display: none; }

    .section-hud {
      position: absolute;
      right: 12px;
      bottom: 12px;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      backdrop-filter: blur(4px);
    }
    .split-note {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      color: #d9a05b;
      max-width: 220px;
    }
    .split-score {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      color: var(--text-dim);
      text-transform: none;
      letter-spacing: 0;
      white-space: nowrap;
    }
    .split-plane {
      width: 72px;
      height: 18px;
      margin: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .split-plane[hidden] { display: none; }
    .split-reorient {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: transparent;
      color: var(--text-dim);
      font-size: 0.85rem;
      line-height: 1;
      cursor: pointer;
    }
    .split-reorient:hover { color: var(--accent); border-color: var(--accent); }
    .split-reorient[hidden] { display: none; }
    .section-hud-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font: 500 0.7rem var(--font-ui);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-dim);
      cursor: pointer;
      user-select: none;
    }
    .section-hud[data-on="1"] .section-hud-toggle:has([data-section-on]) {
      color: var(--accent);
    }
    .section-hud-toggle[data-on="1"] {
      color: #ff6a4a;
    }
    .section-hud input[type="range"] {
      width: 110px;
      height: 22px;
    }
    .section-hud input[type="range"]:disabled {
      opacity: 0.35;
      cursor: default;
    }
    .section-hud-toggle + .section-hud-toggle {
      margin-left: 4px;
      padding-left: 10px;
      border-left: 1px solid var(--line);
    }

    .start-current {
      appearance: none;
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 8px;
      background: var(--panel-inset);
      border: 1px solid var(--line);
      border-radius: 3px;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }
    .start-current:hover {
      border-color: var(--line-tick);
    }
    .start-current:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    .start-current[aria-expanded="true"] {
      border-color: var(--accent);
    }
    .start-chevron {
      font: 500 10px var(--font-mono);
      color: var(--text-dim);
      width: 0.9em;
      flex-shrink: 0;
    }
    .start-current .start-thumb {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
    }
    .start-current-label {
      flex: 1;
      min-width: 0;
      font: 600 0.85rem var(--font-ui);
      color: var(--text);
    }
    .start-chooser {
      margin-top: 8px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: var(--panel-inset);
    }
    .start-chooser[hidden] { display: none; }
    .start-cards--grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .start-cards--grid .start-card {
      width: auto;
    }

    .control-cluster {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: color-mix(in srgb, var(--panel-inset) 70%, transparent);
    }
    .cluster-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    button.cluster-toggle {
      appearance: none;
      border: none;
      background: transparent;
      color: inherit;
      padding: 0;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-height: 18px;
    }
    button.cluster-toggle:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
      border-radius: 2px;
    }
    .cluster-summary {
      margin-left: auto;
      font: 400 0.7rem var(--font-mono);
      font-variant-numeric: tabular-nums;
      color: var(--text-dim);
      white-space: nowrap;
    }
    .cluster-body { margin-top: 4px; }
    .cluster-body[hidden] { display: none; }
    .control--clustered { gap: 2px; }

    .group-subheader {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin: 10px 0 2px;
    }
    .mass-readout {
      font: 400 0.8rem var(--font-mono);
      font-variant-numeric: tabular-nums;
      text-align: right;
      color: var(--text);
    }

    .share-panel {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: var(--panel-inset);
    }
    .share-panel[hidden] { display: none; }
    .share-url {
      flex: 1;
      min-width: 0;
      font: 400 0.7rem var(--font-mono);
      color: var(--text-dim);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #btn-share[aria-expanded="true"] {
      border-color: var(--accent);
      color: var(--accent);
    }
    #panel { grid-column: 2; grid-row: 2; }

    /* Persistent status: the result, its warning and fix, busy, Export. */
    #bottombar {
      grid-column: 2;
      grid-row: 3;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px max(14px, env(safe-area-inset-right)) 8px 14px;
      background: var(--panel);
      border-top: 1px solid var(--line);
      border-left: 1px solid var(--line);
      min-width: 0;
    }
    #btn-export[hidden] { display: none; }

    /* Busy badge — painted before a heavy compile so the UI never looks
       locked. The blocking work freezes the animation; presence is the
       signal. */
    #busy {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 9px;
      border: 1px solid var(--line);
      border-radius: 3px;
      font: 500 10px var(--font-mono);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-dim);
      flex-shrink: 0;
      pointer-events: none;
    }
    /* Explicit display beats the hidden attribute; restore it. */
    #busy[hidden] { display: none; }
    .empty-note {
      position: absolute;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      width: max-content;
      max-width: min(380px, calc(100% - 32px));
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      font: 12px/1.45 var(--font-mono);
      color: var(--err);
      white-space: pre-line;
    }
    .empty-note[hidden] { display: none; }
    .empty-note p { margin: 0; }
    .empty-note .empty-note-title { color: var(--text); margin-bottom: 6px; }
    .empty-note .control-fix { margin: 10px 0 0; padding: 2px 8px; }
    .busy-ring {
      width: 10px;
      height: 10px;
      border: 2px solid var(--line-tick);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: busy-spin 0.8s linear infinite;
    }
    @keyframes busy-spin {
      to { transform: rotate(360deg); }
    }

    #panel {
      background: var(--panel);
      border-left: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
    }
    .panel-tabs {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .panel-tab {
      appearance: none;
      display: grid;
      justify-items: center;
      gap: 1px;
      min-width: 0;
      min-height: 44px;
      padding: 6px 4px 5px;
      border: none;
      border-bottom: 2px solid transparent;
      background: none;
      color: var(--text-dim);
      cursor: pointer;
    }
    .panel-tab:hover { color: var(--text); }
    .panel-tab:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: -2px;
    }
    .panel-tab[aria-selected="true"] {
      border-bottom-color: var(--accent);
      background: var(--panel-inset);
      color: var(--text);
    }
    .panel-tab-title { font: 600 0.8rem var(--font-ui); }
    .panel-tab[data-marked="1"] .panel-tab-title::after {
      content: " ▲";
      color: var(--warn);
      font-size: 0.62rem;
    }
    .panel-tab-caption {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font: 400 0.62rem var(--font-mono);
      font-variant-numeric: tabular-nums;
      color: var(--text-dim);
      min-height: 0.8rem;
    }
    #panel-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 12px max(14px, env(safe-area-inset-right)) 10px 14px;
    }
    /* Two fields side by side; anything that isn't a field takes the row. */
    .tab-body,
    .cluster-body {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 14px;
      align-items: start;
    }
    .tab-body > :not(.control),
    .cluster-body > :not(.control),
    .control[data-wide="1"],
    .control.has-error { grid-column: 1 / -1; }
    .tab-body[hidden] { display: none; }

    .identity {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1 1 auto;
      max-width: 420px;
      min-width: 0;
      margin-right: auto;
    }
    .identity-name {
      flex: 1;
      min-width: 0;
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      font: 600 0.95rem var(--font-ui);
      padding: 2px 4px;
      margin: -2px -4px;
      border-radius: 2px;
    }
    .identity-name:hover,
    .identity-name:focus {
      background: var(--panel-inset);
      border-color: var(--line);
      outline: none;
    }
    .identity-name:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    .dirty-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
      opacity: 0;
    }
    .dirty-dot[data-on="1"] { opacity: 1; }
    .dirty-label {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--text-dim);
      opacity: 0;
    }
    .dirty-label[data-on="1"] { opacity: 1; }

    .group-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      width: 100%;
    }
    .group-chevron {
      font: 500 10px var(--font-mono);
      color: var(--text-dim);
      width: 0.8em;
      flex-shrink: 0;
    }
    .group-header span {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .group-header::before,
    .group-header::after {
      content: "";
      height: 1px;
      background: var(--line);
      position: relative;
    }
    .group-header::before {
      width: 3px;
      height: 3px;
      background: var(--line-tick);
      flex-shrink: 0;
    }
    .group-header::after {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, var(--line), var(--line));
      box-shadow: 3px 0 0 0 var(--line-tick);
    }
    .group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .control { display: flex; flex-direction: column; gap: 2px; }
    .control[data-hidden="1"] { display: none; }
    .control[data-inert="1"] {
      opacity: 0.38;
      pointer-events: none;
    }

    #panel[data-locked="1"] .tab-body:not([data-tab="files"]) {
      opacity: 0.38;
    }
    .panel-lock-note {
      margin: 0 0 8px;
      padding: 8px 10px;
      font-size: 12px;
      line-height: 1.35;
      color: var(--text-dim);
      border: 1px solid var(--line);
      border-radius: 3px;
      background: rgba(0, 0, 0, 0.2);
    }
    .panel-lock-note[hidden] { display: none; }

    .start-group { margin: 0 0 4px; }
    .start-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .start-header > span:first-child { flex: 1 1 auto; }
    /* Session mode + Undo live at the header's right edge; no trailing rule. */
    .start-header::after { display: none; }
    .session-mode {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .session-mode[data-mode="edit"] {
      color: var(--accent);
    }
    .undo-chip { flex-shrink: 0; }
    .start-cards {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .start-card {
      appearance: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      width: 60px;
      padding: 6px 2px 5px;
      background: var(--panel-inset);
      border: 1px solid var(--line);
      border-radius: 3px;
      color: var(--text-dim);
      font: 500 9px var(--font-ui);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .start-card:hover {
      color: var(--text);
      border-color: var(--line-tick);
    }
    .start-card:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    .start-card[data-active="1"] {
      border-color: var(--accent);
      color: var(--accent);
    }
    .start-card[data-edited="1"] {
      border-style: dashed;
      border-color: var(--accent);
      color: var(--text);
    }
    .start-thumb {
      display: block;
      width: 38px;
      height: 38px;
    }
    .start-thumb svg {
      display: block;
      width: 100%;
      height: 100%;
    }
    .thumb-back { opacity: 0.25; }
    .start-card-label {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .start-presets .start-card { width: 84px; }
    .start-presets .start-card-label {
      white-space: normal;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      line-height: 1.3;
    }
    .control-error {
      font-size: 12px;
      color: var(--err);
      margin: 0;
      line-height: 1.3;
    }
    .control-error:empty { display: none; }
    .control-fix {
      font: inherit;
      color: var(--err);
      background: none;
      border: 1px solid currentColor;
      border-radius: 3px;
      padding: 0 5px;
      margin-left: 2px;
      cursor: pointer;
    }
    .control-fix:hover { background: color-mix(in srgb, var(--err) 12%, transparent); }

    .control-row {
      display: grid;
      grid-template-columns: 1fr 7ch 2.5ch;
      align-items: center;
      gap: 6px;
      min-height: 24px;
    }
    /* Label and value over the slider. Fixed value column: the readout and
       editor swap, and 1→100 digit growth, must not move the label. */
    .control-row--range {
      grid-template-columns: minmax(0, 1fr) 9ch;
      grid-template-areas: "label value" "track track";
      gap: 0 6px;
    }
    .control-row--range label { grid-area: label; }
    .control-row--range .value-box { grid-area: value; }
    .control-row--range input[type="range"] { grid-area: track; }
    .control-row--seed {
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas: "label label" "field reroll";
      gap: 0 6px;
    }
    .control-row--seed label { grid-area: label; }
    .control-row--seed input { grid-area: field; }
    .control-row--seed .reroll { grid-area: reroll; }
    .control-row--seg {
      grid-template-columns: minmax(0, 1fr);
      gap: 2px;
    }
    .control[data-wide="1"] .control-row--seg {
      grid-template-columns: 4.5rem minmax(0, 1fr);
      gap: 8px;
    }
    .control-row--number {
      grid-template-columns: 1fr 7ch 2.5ch;
    }
    .control-row--material { grid-template-columns: 4.5rem 1fr; }
    .value-box {
      display: flex;
      align-items: center;
      gap: 2px;
      justify-content: flex-end;
      width: 9ch;
      min-width: 9ch;
      flex-shrink: 0;
    }
    .value-readout {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      font: 400 0.8rem var(--font-mono);
      font-variant-numeric: tabular-nums;
      text-align: right;
      padding: 3px 4px;
      border-radius: 2px;
      box-sizing: border-box;
      width: 6.5ch;
      min-width: 6.5ch;
      cursor: text;
      white-space: nowrap;
      overflow: hidden;
    }
    .value-readout:hover {
      background: var(--panel-inset);
      border-color: var(--line);
    }
    .value-readout:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    .value-readout[hidden],
    .value-input[hidden] {
      display: none !important;
    }
    .value-box .value-input {
      box-sizing: border-box;
      width: 6.5ch;
      min-width: 6.5ch;
    }
    .value-box .unit {
      width: 2.5ch;
      flex: none;
      text-align: left;
      white-space: nowrap;
    }
    /* Typed-value errors: highlight in place — no layout change, the
       preview keeps the last committed value until the text is fixed. */
    .control-row input.is-invalid,
    .control-row input.is-invalid:focus {
      border-color: var(--err);
      background: color-mix(in srgb, var(--err) 14%, var(--panel-inset));
      color: var(--text);
    }
    .scrub-label {
      cursor: ew-resize;
      user-select: none;
    }
    .material-select {
      appearance: none;
      width: 100%;
      border: 1px solid var(--line);
      background: var(--panel-inset);
      color: var(--text);
      font: 400 0.75rem var(--font-ui);
      padding: 0.35rem 0.5rem;
      border-radius: 2px;
    }
    .material-select:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    .control-row label {
      font-size: 0.8rem;
      color: var(--text-dim);
    }
    .control-row input[type="number"] {
      appearance: textfield;
      -moz-appearance: textfield;
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      font: 400 0.8rem var(--font-mono);
      font-variant-numeric: tabular-nums;
      text-align: right;
      padding: 3px 4px;
      border-radius: 2px;
    }
    .control-row input[type="number"]::-webkit-outer-spin-button,
    .control-row input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .control-row input[type="number"]:hover,
    .control-row input[type="number"]:focus {
      background: var(--panel-inset);
      border-color: var(--line);
      outline: none;
    }
    .control-row input[type="number"]:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    .unit {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-dim);
      opacity: 0.6;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 24px;
      background: transparent;
      margin: 0;
      cursor: pointer;
    }
    input[type="range"]:focus { outline: none; }
    input[type="range"]:focus-visible::-webkit-slider-thumb {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 3px;
      background: var(--line-tick);
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 22px;
      margin-top: -9.5px;
      background: var(--text-dim);
      border: none;
      border-radius: 1px;
      transition: background 120ms ease;
    }
    input[type="range"]:active::-webkit-slider-thumb,
    input[type="range"]:focus::-webkit-slider-thumb {
      background: var(--accent);
    }
    input[type="range"]::-moz-range-track {
      height: 3px;
      background: var(--line-tick);
    }
    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 22px;
      background: var(--text-dim);
      border: none;
      border-radius: 1px;
    }
    input[type="range"]:active::-moz-range-thumb,
    input[type="range"]:focus::-moz-range-thumb {
      background: var(--accent);
    }

    .segments {
      display: flex;
      border: 1px solid var(--line);
      border-radius: 2px;
      overflow: hidden;
    }
    .segments button {
      flex: 1;
      appearance: none;
      border: none;
      border-radius: 0;
      background: transparent;
      color: var(--text-dim);
      font: 400 0.75rem var(--font-ui);
      padding: 0.35rem 0.3rem;
      cursor: pointer;
      letter-spacing: 0.02em;
      box-shadow: inset 0 -2px 0 transparent;
    }
    .segments button[aria-pressed="true"] {
      background: var(--panel-inset);
      color: var(--text);
      box-shadow: inset 0 -2px 0 var(--accent);
    }
    .segments button:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: -2px;
      z-index: 1;
    }
    .seg-custom {
      align-self: center;
      padding: 0 0.5rem;
      font: 500 0.65rem var(--font-mono);
      color: var(--warn);
      white-space: nowrap;
    }
    .reroll {
      appearance: none;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: transparent;
      color: var(--text-dim);
      font: 500 1rem var(--font-mono);
      width: 1.6rem;
      height: 1.6rem;
      cursor: pointer;
      line-height: 1;
      padding: 0;
    }
    .reroll:hover { color: var(--accent); border-color: var(--accent); }
    .reroll:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
    input.is-readout {
      opacity: 0.65;
      pointer-events: none;
    }

    .hint {
      margin: 0;
      font-size: 0.7rem;
      color: var(--text-dim);
      line-height: 1.35;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn {
      appearance: none;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text);
      padding: 0.55rem 0.9rem;
      border-radius: 2px;
      font: 600 11px var(--font-ui);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 120ms ease, color 120ms ease;
    }
    .btn:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn-accent {
      border-color: var(--accent);
      color: var(--accent);
    }
    .btn-accent:hover:not(:disabled) {
      background: var(--accent);
      color: var(--accent-ink);
    }
    .btn:hover:not(:disabled):not(.btn-accent) {
      background: var(--panel-inset);
    }
    .face-readout {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-dim);
    }
    .face-row[hidden] { display: none; }
    .face-label {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-bottom: 4px;
    }
    .face-stepper {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }
    .btn-quiet {
      appearance: none;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text-dim);
      padding: 0.25rem 0.45rem;
      border-radius: 2px;
      font: 500 11px var(--font-mono);
      cursor: pointer;
    }
    .btn-quiet:hover:not(:disabled) {
      color: var(--text);
      border-color: var(--text-dim);
    }
    .btn-quiet:disabled { cursor: default; }
    .preset-chip {
      appearance: none;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text-dim);
      padding: 0.3rem 0.55rem;
      border-radius: 2px;
      font: 500 10px var(--font-ui);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .preset-chip[data-active="1"] {
      border-color: var(--accent);
      color: var(--accent);
    }
    .preset-chip[data-edited="1"] {
      border-style: dashed;
      color: var(--text);
    }
    .preset-chip:hover {
      color: var(--text);
    }
    .preset-chip:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    /* Onboarding dialog */
    .onboarding {
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--panel);
      color: var(--text);
      padding: 0;
      max-width: min(420px, calc(100vw - 32px));
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
    }
    .onboarding::backdrop {
      background: rgba(0, 0, 0, 0.55);
    }
    .onboarding-body {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 22px 24px 20px;
      margin: 0;
    }
    .onboarding-body h2 {
      margin: 0;
      font: 600 1.05rem var(--font-ui);
      letter-spacing: 0.02em;
    }
    .onboarding-steps {
      margin: 0;
      padding-left: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 0.85rem;
      line-height: 1.45;
      color: var(--text-dim);
    }
    .onboarding-steps strong { color: var(--text); font-weight: 600; }
    .onboarding-note {
      margin: 0;
      font-size: 0.75rem;
      color: var(--text-dim);
      line-height: 1.4;
    }
    .onboarding-note kbd {
      font: 500 0.7rem var(--font-mono);
      padding: 1px 5px;
      border: 1px solid var(--line);
      border-radius: 2px;
      color: var(--accent);
    }
    .onboarding-dismiss {
      align-self: flex-end;
      min-width: 7rem;
    }

    #status-line {
      flex: 1 1 auto;
      min-width: 0;
      max-height: 30vh;
      overflow-y: auto;
      display: grid;
      gap: 3px;
      font: 400 0.7rem/1.4 var(--font-mono);
      font-variant-numeric: tabular-nums;
      color: var(--text-dim);
    }
    .status-head {
      color: var(--text);
      white-space: pre-line;
      overflow-wrap: anywhere;
    }
    .status-head.err { color: var(--err); }
    .status-problem {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .status-problem[hidden] { display: none; }
    .status-warning { color: var(--warn); }
    .status-problem .status-warning {
      flex: 1 1 auto;
      min-width: 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .status-problem .control-fix { flex-shrink: 0; color: var(--warn); }

    .file-list,
    .file-notes,
    .file-geometry {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .file-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: var(--panel-inset);
    }
    .file-thumb { flex: none; }
    .file-thumb svg { display: block; width: 48px; height: 36px; border-radius: 2px; }
    .file-text { flex: 1 1 auto; min-width: 0; }
    .file-name { font: 500 0.72rem var(--font-mono); color: var(--text); overflow-wrap: anywhere; }
    .file-detail { font-size: 0.7rem; color: var(--text-dim); line-height: 1.35; margin-top: 2px; }
    .file-row .btn { flex: none; padding: 0.45rem 0.7rem; }
    .file-geometry-line { font: 400 0.7rem/1.4 var(--font-mono); color: var(--text-dim); }
    .file-actions { display: flex; gap: 8px; }
    .file-actions .btn { flex: 1; }
    .file-actions .btn[hidden] { display: none; }

    /* A finger needs 44 px, wherever the pointer is one. The value keeps its
       small box and grows its reach, so a field doesn't get taller. */
    @media (pointer: coarse), (max-width: 899px) {
      .segments button,
      .sheet-tab,
      .btn,
      .btn-quiet,
      .preset-chip,
      .control-fix,
      .reroll,
      .material-select,
      .identity-name,
      .app-header-help,
      button.cluster-toggle,
      .section-hud-toggle { min-height: 44px; }
      .reroll,
      .app-header-help { width: 44px; }
      .segments { flex-wrap: wrap; }
      .segments button,
      .sheet-tab,
      .file-row .btn,
      .face-stepper .btn-quiet { min-width: 44px; }
      .sheet-flat-tabs { flex-wrap: wrap; }
      .split-reorient { width: 44px; height: 44px; }
      input[type="range"],
      .section-hud input[type="range"] { height: 44px; }
      button.value-readout { min-height: 44px; margin-block: -10px; }
      button.value-readout:hover { background: transparent; border-color: transparent; }
      .control-row input[type="number"] { min-height: 44px; }
      .panel-tab { min-height: 52px; }
      .start-current { min-height: 58px; }
    }

    /* Model, then status, the tab's rows, and the tabs under the thumb. */
    @media (max-width: 899px) {
      #app {
        position: relative;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr) auto minmax(0, 1.4fr) auto;
      }
      #app-header {
        position: absolute;
        inset: 0 0 auto;
        padding: calc(6px + env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) 6px max(8px, env(safe-area-inset-left));
        background: none;
        border: none;
        pointer-events: none;
      }
      #app-header > * { pointer-events: auto; }
      .app-brand,
      .app-header-link,
      .dim-callout { display: none; }
      .identity {
        padding: 0 8px;
        border: 1px solid var(--line);
        border-radius: 3px;
        background: color-mix(in srgb, var(--panel) 88%, transparent);
      }
      .identity-name:hover,
      .identity-name:focus { border-color: transparent; }
      .dirty-label { display: none; }
      .app-header-help { background: color-mix(in srgb, var(--panel) 88%, transparent); }
      #canvas-host { grid-column: 1; grid-row: 1; }
      #bottombar {
        grid-column: 1;
        grid-row: 2;
        padding: 6px max(12px, env(safe-area-inset-right)) 6px max(12px, env(safe-area-inset-left));
        border-left: none;
      }
      #btn-export { display: none; }
      #panel { display: contents; }
      #panel-scroll {
        grid-column: 1;
        grid-row: 3;
        padding: 10px max(12px, env(safe-area-inset-right)) 10px max(12px, env(safe-area-inset-left));
        background: var(--panel);
        border-top: 1px solid var(--line);
      }
      .panel-tabs {
        grid-column: 1;
        grid-row: 4;
        padding-bottom: env(safe-area-inset-bottom);
        background: var(--panel);
        border-top: 1px solid var(--line);
        border-bottom: none;
      }
      .panel-tab {
        border-top: 2px solid transparent;
        border-bottom: none;
      }
      .panel-tab[aria-selected="true"] { border-top-color: var(--accent); }
      /* The header floats over the viewport, so Flat starts below it. */
      #canvas-host .sheet-flat {
        padding-top: calc(62px + env(safe-area-inset-top));
        padding-left: max(12px, env(safe-area-inset-left));
        padding-right: max(12px, env(safe-area-inset-right));
      }
      .section-hud {
        left: max(8px, env(safe-area-inset-left));
        right: max(8px, env(safe-area-inset-right));
        bottom: 8px;
        padding: 0 8px;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: space-between;
      }
      .section-hud:not([data-on="1"]) [data-section-z] { display: none; }
      .section-hud-toggle + .section-hud-toggle { margin-left: 0; padding-left: 0; border-left: none; }
    }

    /* Phone sideways: the tabs are a rail between the model and the rows. */
    @media (max-width: 899px) and (max-height: 500px) {
      #app {
        grid-template-columns: minmax(0, 1fr) 72px minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr) auto;
      }
      #app-header { right: calc(50% + 36px); }
      .session-mode { display: none; }
      #bottombar {
        grid-column: 1;
        grid-row: 2;
        padding-bottom: max(6px, env(safe-area-inset-bottom));
      }
      #panel-scroll {
        grid-column: 3;
        grid-row: 1 / -1;
        padding-bottom: max(10px, env(safe-area-inset-bottom));
        border-top: none;
      }
      .panel-tabs {
        grid-column: 2;
        grid-row: 1 / -1;
        grid-template-columns: minmax(0, 1fr);
        grid-auto-rows: 1fr;
        padding-bottom: 0;
        border-top: none;
        border-left: 1px solid var(--line);
        border-right: 1px solid var(--line);
      }
      .panel-tab {
        min-height: 0;
        align-content: center;
        border-top: none;
        border-left: 2px solid transparent;
      }
      .panel-tab[aria-selected="true"] { border-left-color: var(--accent); }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Header mounted by createChrome in main.js -->
    <div id="canvas-host"></div>
    <aside id="panel"></aside>
    <footer id="bottombar">
      <div id="status-line" aria-live="polite"></div>
      <div id="busy" hidden>
        <span class="busy-ring" aria-hidden="true"></span>
        <span>updating</span>
      </div>
    </footer>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
